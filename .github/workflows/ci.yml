name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src

  docker:
    # The sandbox tests, marked docker. The test image is pulled here, by a
    # pinned digest, before the tests; nothing is pulled during a run.
    runs-on: ubuntu-latest
    env:
      TEST_IMAGE: python:3.12-slim-bookworm
      TEST_IMAGE_DIGEST: sha256:e697c81897302a4c4333bade000d98038fbb21eb064f8ee1fd42d02ebcd9d337
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Docker version
        run: docker version
      - name: Pull the test image by digest
        run: |
          docker pull "python@${TEST_IMAGE_DIGEST}"
          docker tag "python@${TEST_IMAGE_DIGEST}" "${TEST_IMAGE}"
      - name: Docker tests
        run: uv run pytest -m docker -v

