[project]
name = "utux"
version = "0.1.0"
description = "Modular multi-agent framework for reliable computational research, from idea to reviewed manuscript."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.urls]
Repository = "https://github.com/malekpouri/utux-agent"

[project.scripts]
utux = "utux.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/utux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests need the network and API keys; `-m live` on the command line
# overrides this default selection.
addopts = ["--strict-markers", "--strict-config", "-m", "not live"]
markers = [
    "live: needs network access and API keys; deselected unless run with `-m live`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4", "PT", "RUF", "D"]
ignore = [
    "D105",  # magic methods are documented by their protocol
    "D107",  # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
